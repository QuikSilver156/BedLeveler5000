name: 'Create release'
run-name: 'Create release ${{  github.ref_name }}'
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  Build:
    name: Build
    uses: ./.github/workflows/build.yaml
    with:
      TAG: ${{  github.ref_name }}
  Release:
    name: Release
    runs-on: ubuntu-latest
    needs: Build
    # Release with whatever platforms built (e.g. if GitHub has no macOS runner free), as long as
    # the Windows build is there; the Create assets step checks that.
    if: ${{ !cancelled() }}
    environment: Deployment
    env:
      TAG: ${{ github.ref_name }}
      WINDOWS_STEM: BedLeveler5000-${{ github.ref_name }}-windows-x86_64
      LINUX_STEM: BedLeveler5000-${{ github.ref_name }}-linux-x86_64
      MACOS_INTEL_STEM: BedLeveler5000-${{ github.ref_name }}-macos-x86_64
      MACOS_M1_STEM: BedLeveler5000-${{ github.ref_name }}-macos-m1
      HASHES_FILE: BedLeveler5000-${{ github.ref_name }}-SHA-256.txt
      HAS_GPG_KEY: ${{ secrets.GPG_SIGNING_KEY != '' }}
      ASC_FILE: BedLeveler5000-${{ github.ref_name }}-SHA-256.txt.asc
    steps:
      - uses: actions/download-artifact@v7
      - name: Create assets
        run: |
          if [ ! -d Artifacts-Windows ]; then
            echo "::error::The Windows build is missing, so no release is created."
            exit 1
          fi
          ASSETS=""
          mv Artifacts-Windows ${WINDOWS_STEM}
          7z a ${WINDOWS_STEM}.7z ${WINDOWS_STEM}
          ASSETS="${WINDOWS_STEM}.7z"
          package() {  # artifact folder, stem
            if [ -d "$1" ]; then
              mv "$1" "$2"
              tar zcvf "$2.tgz" "$2"
              ASSETS="$ASSETS $2.tgz"
            else
              echo "::warning::$1 is missing (that build failed or never ran); releasing without it."
            fi
          }
          package Artifacts-Linux ${LINUX_STEM}
          package Artifacts-MacOS-Intel ${MACOS_INTEL_STEM}
          package Artifacts-MacOS-M1 ${MACOS_M1_STEM}
          echo "ASSETS=$ASSETS" >> "$GITHUB_ENV"
      - name: Create hashes file
        run: |
          sha256sum --binary ${ASSETS} > ${HASHES_FILE}
          cat ${HASHES_FILE}
      - name: Sign hashes file
        if: ${{ env.HAS_GPG_KEY == 'true' }}
        env:
          GNUPGHOME: ~/.gnupg
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_PASSWORD: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%s' "$GPG_SIGNING_KEY" > ~/.gnupg/private.key
          chmod 400 ~/.gnupg/private.key
          printf '%s' $GPG_SIGNING_KEY_PASSWORD | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --import ~/.gnupg/private.key
          printf '%s' $GPG_SIGNING_KEY_PASSWORD | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --armor --output ${ASC_FILE} --detach-sig ${HASHES_FILE}
          rm -rf ~/.gnupg
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The signature is only attached when a GPG key is configured
          SIGNATURE=""
          if [ -f "${ASC_FILE}" ]; then SIGNATURE="${ASC_FILE}"; fi
          gh release create "$TAG" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${TAG}-QS (community build)" \
              --verify-tag \
              --generate-notes \
              ${ASSETS} \
              ${HASHES_FILE} \
              ${SIGNATURE}